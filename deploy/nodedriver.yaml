apiVersion: management.cattle.io/v3
kind: NodeDriver
metadata:
  name: nebius
  annotations:
    publicCredentialFields: projectId,apiEndpoint
    privateCredentialFields: saId,publicKeyId,privateKey
    optionalCredentialFields: projectId,apiEndpoint
    passwordFields: privateKey
    defaults: apiEndpoint:api.nebius.cloud:443
    nodedriver.cattle.io/file-to-field-aliases: privateKey:privateKeyPath
spec:
  active: true
  addCloudCredential: true
  builtin: false
  # v0.1.0 linux/amd64 release archive.
  checksum: "67584af3b2a8b73d2ad678bb4f528d33f0167b6494412adec8b02952ee52d709"
  description: Nebius AI Cloud node driver
  displayName: Nebius AI Cloud
  externalId: ""
  url: https://github.com/gorizond/docker-machine-driver-nebius/releases/download/v0.1.0/docker-machine-driver-nebius_v0.1.0_linux_amd64.tar.gz
  whitelistDomains:
    - api.nebius.cloud
    - auth.eu.nebius.com
