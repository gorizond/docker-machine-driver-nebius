name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag || '', 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/docker-machine-driver-nebius" ./cmd/docker-machine-driver-nebius

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bin_path="dist/docker-machine-driver-nebius"
          out="artifacts/docker-machine-driver-nebius_${TAG}_${GOOS}_${GOARCH}.tar.gz"
          BIN_PATH="${bin_path}" OUT_PATH="${out}" python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          bin_path = Path(os.environ["BIN_PATH"])
          out_path = Path(os.environ["OUT_PATH"])
          out_path.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(out_path, "w:gz") as tf:
              tf.add(bin_path, arcname=bin_path.name)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          if-no-files-found: error

  upload:
    name: upload assets to release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag || '', 'v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
